[build]
  publish = "."

# Keep this as a static deploy. The local `/server` folder is for optional
# localhost image generation and is not required on Netlify.

[[headers]]
  for = "/word-monsters/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ghost-word-run/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/monster-maker/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/missions.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
